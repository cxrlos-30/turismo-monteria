<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nueva contraseña</title>
  <link rel="stylesheet" href="estilos.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body class="login-body">

<div class="login-container">
  <div class="login-box">

    <h2>Cambiar contraseña</h2>

    <input type="password" id="newPassword" placeholder="Nueva contraseña">

    <button onclick="updatePassword()" class="btn-reset">
      Guardar contraseña
    </button>

    <p id="mensaje"></p>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>

<script>
window.addEventListener("load", async () => {
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  if (code) {
    const { error } = await window._supabase.auth.exchangeCodeForSession(code);
    if (error) {
      document.getElementById("mensaje").textContent =
        "El enlace ha expirado o ya fue usado. Solicita uno nuevo.";
      setTimeout(() => window.location.href = "login.html", 3000);
      return;
    }
    return;
  }
  const hash = new URLSearchParams(window.location.hash.replace("#", "?"));
  const accessToken = hash.get("access_token");
  const refreshToken = hash.get("refresh_token");
  const type = hash.get("type");
  if (accessToken && type === "recovery") {
    const { error } = await window._supabase.auth.setSession({
      access_token: accessToken,
      refresh_token: refreshToken
    });
    if (error) {
      document.getElementById("mensaje").textContent =
        "El enlace ha expirado o ya fue usado. Solicita uno nuevo.";
      setTimeout(() => window.location.href = "login.html", 3000);
      return;
    }
    return;
  }
  document.getElementById("mensaje").textContent =
    "Enlace inválido. Solicita un nuevo correo de recuperación.";
  setTimeout(() => window.location.href = "login.html", 3000);
});
</script>

</body>
</html>
